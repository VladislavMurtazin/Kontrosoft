name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/**
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            pkg-config \
            ninja-build \
            protobuf-compiler \
            libprotobuf-dev \
            libgrpc++-dev \
            libgrpc-dev \
            libboost-system-dev \
            python3 \
            python3-pip \
            python3-venv

      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Test
        run: |
          source .venv/bin/activate
          chmod +x test.sh
          ./test.sh
